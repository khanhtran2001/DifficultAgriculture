# General configuration
general:
  random_seed: [123, 456, 789]  # List of random seeds for reproducibility


# Dataset configuration
dataset_config:
  name: minneapple
  type: "yolo_detection"
  root_dir: /home/khanh/Projects/DifficultyAgri/datasets/minneapple/yolo_format/minneapple_yolo 
  train_mask_dir: /home/khanh/Projects/DifficultyAgri/datasets/minneapple/raw/MinneAppleDetection/test_data/detection/images
  num_classes: 1
  class_names: ["apple"]


# Model configuration
baseline_config:

  # Model overview and structure
  name: yolov8s
  model_type: "yolo"
  pretrained_weights_path: "/home/khanh/Projects/DifficultyAgri/finetuned_baseline_model/yolov8s.pt" 
  
  # Training parameters
  training_config:
    epochs: 100 
    batch_size: 16
    input_size: 1024
    learning_rate: 0.01
    early_stopping_patience: 10
    seed: 123

  # Augmentation parameters disabled for plain training
    augmentation:
      hsv_h: 0.0
      hsv_s: 0.0
      hsv_v: 0.0

      # Geometric transforms disabled
      degrees: 0.0
      translate: 0.0
      scale: 0.0
      shear: 0.0
      perspective: 0.0

      # Flips disabled
      fliplr: 0.0
      flipud: 0.0

      # Ultralytics augmentation controls disabled
      mosaic: 0.0
      mixup: 0.0
      copy_paste: 0.0
      cutmix: 0.0
      close_mosaic: 0
    
  # Evaluation metrics
  evaluation_config:
    image_size: 1024
    confidence_threshold: 0.001 
    iou_threshold: 0.5
    max_detections: 100 
    metrics: ["mAP", "AP_50", "AP_75", "AP_small", "AP_medium", "AP_large"]


# Scoring configuration
scoring_config:
  type: "min_scorer"
  alpha: 0.5
  beta: 0.5
  iou_threshold: 0.5
  weight_mode: "balance_correlation"  # fixed | mean_match | balance_correlation
  object_weight: 0.9
  false_positive_weight: 0.1


# Copy-paste augmentation configuration (simplified)
augmentation_config:
  # Use score-guided selection (set to false for random selection)
  use_score_guidance: false 

  # If true, pasted objects are selected only from the same background image.
  # If false, pasted objects are selected from the whole training pool.
  same_image_only: true 

  # Score weighting for score-guided selection: linear | exponential
  # alpha controls how strongly high-score samples are preferred.
  score_weight_function: linear 
  score_alpha: 3.0
  
  # Number of generated augmented images = int(num_train_images * dataset_ratio)
  dataset_ratio: 0.5
  
  # Number of objects to paste per augmented image (uniform random in [min, max])
  min_objects_per_image: 2 
  max_objects_per_image: 8
  
  # Image extensions to discover
  image_extensions: [".jpg", ".jpeg", ".png", ".bmp", ".webp"]
  
  # Selection seed for reproducibility (set to null/None for random)
  selection_seed: 123
  
  # Reuse caps (null/None disables cap)
  max_image_reuse: 1
  max_object_reuse: 1

  # Minimum source object area (in pixel^2) to be eligible for copy-paste.
  # Example: 32x32 => 1024. Objects smaller than this are excluded from the pool.
  min_object_area_px: 500
  
  # Transform parameters
  scale_min: 0.8
  scale_max: 1.2
  rotation_deg_max: 30.0

  # Placement behavior for copy-paste objects
  avoid_overlap: true
  placement_margin_px: 5
  random_placement_attempts: 12
  use_jiggle_placement: true