# Global Wheat Head YOLO pipeline configuration
#
# Dataset expected layout:
#   root_dir/
#     train/images, train/labels
#     val/images,   val/labels
#     test/images,  test/labels (optional but recommended)


# General configuration
general:
  random_seed: [123, 456, 789]


# Dataset configuration
dataset_config:
  name: global_wheat_head
  type: "yolo_detection"
  root_dir: /home/khanh/Projects/DifficultyAgri/datasets/global_wheat_head/yolo_format/global_wheat_head_yolo
  train_mask_dir: null
  num_classes: 1
  class_names: ["wheat_head"]


# Model configuration
baseline_config:
  name: yolov8s
  model_type: "yolo"
  pretrained_weights_path: "/home/khanh/Projects/DifficultyAgri/finetuned_baseline_model/yolov8s.pt"

  training_config:
    epochs: 100
    batch_size: 16
    input_size: 1024
    learning_rate: 0.01
    early_stopping_patience: 8
    seed: 123 

    augmentation:
      hsv_h: 0.0
      hsv_s: 0.0
      hsv_v: 0.0

      # Geometric transforms disabled
      degrees: 0.0
      translate: 0.0
      scale: 0.0
      shear: 0.0
      perspective: 0.0

      # Flips disabled
      fliplr: 0.0
      flipud: 0.0

      # Ultralytics augmentation controls disabled
      mosaic: 0.0
      mixup: 0.0
      copy_paste: 0.0
      cutmix: 0.0
      close_mosaic: 0

    # augmentation:
    #   hsv_h: 0.015      # Image HSV-Hue augmentation (fraction)
    #   hsv_s: 0.7        # Image HSV-Saturation augmentation (fraction)
    #   hsv_v: 0.4        # Image HSV-Value/Brightness augmentation (fraction)

    #   # Geometric (Spatial Variance - tuned to protect small bounding boxes)
    #   degrees: 180.0     # Image rotation (+/- deg). Kept small to prevent bbox distortion.
    #   translate: 0.1    # Image translation (+/- fraction).
    #   scale: 0.5        # Image scale (+/- gain). Reduced from default 0.5 to prevent shrinking objects too much.
    #   shear: 0.0        # Image shear (+/- deg). Kept at 0 as it severely distorts tight bboxes.
    #   perspective: 0.0  # Image perspective (+/- fraction). Kept at 0.

    #   # Flips
    #   fliplr: 0.5       # Image flip left-right (probability). Standard 50%.
    #   flipud: 0.0       # Image flip up-down (probability). Set to 0.5 ONLY for top-down datasets like Wheat. Keep 0.0 for MinneApple.

    #   # Ultralytics augmentation controls disabled
    #   mosaic: 1.0
    #   mixup: 0.0
    #   copy_paste: 0.0
    #   cutmix: 0.0
    #   close_mosaic: 0

  evaluation_config:
    image_size: 1024
    confidence_threshold: 0.001
    iou_threshold: 0.5
    max_detections: 600
    metrics: ["mAP", "AP_50", "AP_75", "AP_small", "AP_medium", "AP_large"]


# Scoring configuration
scoring_config:
  type: "min_scorer"
  alpha: 0.5
  beta: 0.5
  iou_threshold: 0.5
  weight_mode: "balance_correlation"  # fixed | mean_match | balance_correlation
  object_weight: 0.9
  false_positive_weight: 0.1


# Copy-paste augmentation configuration (simplified)
augmentation_config:
  # Use score-guided selection (set to false for random selection)
  use_score_guidance: true 

  # If true, lower-score objects/images are selected more often instead of higher-score ones
  reverse_score_guidance: false

  # If true, pasted objects are selected only from the same background image.
  # If false, pasted objects are selected from the whole training pool.
  same_image_only: true 

  # Score weighting for score-guided selection: linear | exponential
  # alpha controls how strongly high-score samples are preferred.
  score_weight_function: linear 
  score_alpha: 3.0
  
  # Number of generated augmented images = int(num_train_images * dataset_ratio)
  dataset_ratio: 0.3
  
  # Number of objects to paste per augmented image (uniform random in [min, max])
  min_objects_per_image: 2
  max_objects_per_image: 8
  
  # Image extensions to discover
  image_extensions: [".jpg", ".jpeg", ".png", ".bmp", ".webp"]
  
  # Selection seed for reproducibility (set to null/None for random)
  selection_seed: 123
  
  # Reuse caps (null/None disables cap)
  max_image_reuse: 3
  max_object_reuse: 3

  # Minimum source object area (in pixel^2) to be eligible for copy-paste.
  # Example: 32x32 => 1024. Objects smaller than this are excluded from the pool.
  min_object_area_px: 000 
  
  # Transform parameters
  scale_min: 0.8
  scale_max: 1.2
  rotation_deg_max: 0.0

  # Placement behavior for copy-paste objects
  avoid_overlap: true
  placement_margin_px: 5
  random_placement_attempts: 12
  use_jiggle_placement: true
